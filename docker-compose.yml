# Optional: PostgreSQL in Docker instead of the ZIP archive (Lab 1, section 1.9.1).
# Start with: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: global_health
      POSTGRES_USER: gh_user
      POSTGRES_PASSWORD: gh_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
